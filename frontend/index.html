<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Experiment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Attention Experiment</h1>
    <div class="stimuli">

        <div class="input-group">
            <textarea name="a" placeholder="First stimulus"></textarea>
            <div class="box-controls">
                <button tag="L" box="a">L</button>
                <button tag="R" box="a">R</button>
                <label>
                    <input type="checkbox" name="flipA"> flip
                </label>
            </div>
        </div>

        <div class="input-group">
            <textarea name="b" placeholder="Second stimulus"></textarea>
            <div class="box-controls">
                <button tag="L" box="b">L</button>
                <button tag="R" box="b">R</button>
                <label>
                    <input type="checkbox" name="flipB"> flip
                </label>
            </div>
        </div>

    </div>

    <button class="generate" tag="generate">Generate Audio</button>

    <div class="arrangement">
        <div class="control-group">
            <button tag="B">B</button>
        </div>
        <div class="control-group">
            <button tag="P">P</button>
        </div>
    </div>


</body>
</html>
